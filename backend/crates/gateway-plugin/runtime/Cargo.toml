[package]
name = "gateway-plugin-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
autotests = false

[dependencies]
async-trait = "0.1.89"
base64 = "0.23.0"
bytes = "1.11.1"
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
flate2 = "1.1.9"
futures = "0.3.32"
gateway-admin = { path = "../../gateway-admin" }
gateway-core = { path = "../../gateway-core" }
gateway-host = { path = "../../gateway-host" }
gateway-plugin-sdk = { path = "../sdk", features = ["io"] }
gateway-protocol = { path = "../../gateway-protocol" }
hex = "0.4.3"
image = { version = "0.25.8", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "webp"] }
jsonschema = { version = "0.57.0", default-features = false }
roxmltree = "0.21.1"
semver = "1.0.27"
secrecy = "0.10.3"
serde = "1.0.228"
serde_json = "1.0.150"
sha2 = "0.11.0"
tar = "0.4.44"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", default-features = false, features = ["macros", "rt", "sync", "time", "io-util", "io-std"] }
tracing = "0.1.44"
uuid = { version = "1.23.3", features = ["v4"] }
url = "2.5.8"

[dev-dependencies]
wiremock = "0.6.5"
gateway-store = { path = "../../gateway-store" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
tokio = { version = "1.52.3", default-features = false, features = ["rt-multi-thread", "test-util"] }

[[bin]]
name = "gateway-plugin-test-worker"
path = "tests/support/worker.rs"
test = false
bench = false
doc = false

[[test]]
name = "main"
path = "tests/main.rs"

[[bin]]
name = "gateway-plugin-test-middleware"
path = "tests/support/middleware.rs"
test = false
bench = false
doc = false

[lints]
workspace = true
