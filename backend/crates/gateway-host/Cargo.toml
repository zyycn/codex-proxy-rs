[package]
name = "gateway-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
autotests = false

[dependencies]
async-trait = "0.1.89"
base64 = "0.23.0"
bytes = "1.11.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
chrono = { version = "0.4.45", features = ["clock", "serde"] }
config = { version = "0.15.23", default-features = false, features = ["yaml"] }
flate2 = "1.1.9"
futures = "0.3.32"
gateway-admin = { path = "../gateway-admin" }
gateway-core = { path = "../gateway-core" }
hex = "0.4.3"
http = "1.4.0"
http-body-util = "0.1.3"
hyper = { version = "=1.11.1", default-features = false }
hyper-rustls = { version = "=0.27.7", default-features = false, features = ["http1", "http2", "tls12"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "client-proxy", "http1", "http2", "tokio"] }
ipnet = "2.11.0"
percent-encoding = "2.3.2"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "stream", "rustls-tls-native-roots", "socks"] }
rustls = { version = "=0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-native-certs = "=0.8.3"
scraper = "0.27.0"
semver = "1.0.27"
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_ignored = "0.1.14"
serde_path_to_error = "0.1.20"
serde_json = "1.0.150"
sha2 = "0.11.0"
tar = "0.4.44"
thiserror = "2.0.18"
tokio = { version = "1.52.3", default-features = false, features = ["macros", "rt", "signal", "time", "sync", "net", "process", "io-util"] }
tower-service = "0.3.3"
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
filetime = "0.2.27"
hyper = { version = "=1.11.1", default-features = false, features = ["server"] }
tempfile = "3.27.0"
tokio = { version = "1.52.3", default-features = false, features = ["rt-multi-thread", "test-util"] }
wiremock = "0.6.5"
tokio-rustls = { version = "=0.26.4", default-features = false }

[[test]]
name = "main"
path = "tests/main.rs"

[[bin]]
name = "gateway-host-process-worker"
path = "tests/support/process_worker.rs"
test = false
bench = false
doc = false

[lints]
workspace = true
